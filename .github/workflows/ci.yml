name: offline-baseline
on: [push, pull_request]
permissions:
  contents: read
# Security notes: actions are pinned to full commit SHAs; this workflow interpolates no
# github.event.* values into run: commands, so there is no script-injection surface.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Synthetic smoke
        run: PYTHONPATH=src python -m hardonian_foundry.cli demo
      - name: Compile
        run: python -m compileall -q src tests
      - name: Install pinned security tooling
        # pip>=26.2 first: pip-audit project mode audits the ephemeral env, which
        # bootstraps with the host pip; older pip versions carry known CVEs.
        run: python -m pip install --quiet --upgrade 'pip>=26.2' && python -m pip install --quiet ruff==0.17.4 bandit==1.9.4 pip-audit==2.10.1
      - name: Ruff lint (lifecycle modules)
        # Scoped to the evidence/licensing/tenancy modules and their tests. Pre-existing
        # findings in baseline.py/cli.py/test_baseline.py are tracked for follow-up once
        # the open provider PR lands; widening the gate then avoids file conflicts now.
        run: >-
          ruff check
          src/hardonian_foundry/evidence.py
          src/hardonian_foundry/licensing.py
          src/hardonian_foundry/tenancy.py
          tests/test_evidence.py
          tests/test_licensing.py
          tests/test_tenancy.py
      - name: Bandit (medium and above)
        run: bandit -q -r src --severity-level medium
      - name: Pip audit
        run: pip-audit --progress-spinner off
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }} # required by v3 for pull_request diff scans
