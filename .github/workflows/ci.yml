name: offline-baseline
on: [push, pull_request]
permissions:
  contents: read
# Security notes: actions are pinned to full commit SHAs; this workflow interpolates no
# github.event.* values into run: commands, so there is no script-injection surface.

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --quiet --upgrade "pip>=26.2"
          python -m pip install --quiet -e ".[signing]" pytest pytest-cov ruff mypy pillow pyyaml
      - name: Offline unit tests (unittest)
        run: python -m unittest discover -s tests -v
      - name: Pytest with coverage gate
        run: pytest --cov=hardonian_foundry --cov-fail-under=85
      - name: Ruff lint
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src
      - name: Compile check
        run: python -m compileall -q src tests scripts examples
      - name: Synthetic & Refinery CLI smoke
        run: |
          foundry --version
          foundry doctor --verbose
          foundry demo
          foundry eval
          foundry policy-demo
          foundry refinery validate-dataset
          foundry refinery preflight
          foundry refinery run --output-root .foundry/ci_runs
          foundry refinery list --output-root .foundry/ci_runs
      - name: Cloned case-study signed replay smoke
        run: |
          foundry refinery inspect run-20261111T031107Z-6a0895d1 --output-root examples/case-study-exception-codes/task/runs
          foundry refinery promote run-20261111T031107Z-6a0895d1 --output-root examples/case-study-exception-codes/task/runs --keyring examples/case-study-exception-codes/task/keyring.json
      - name: Zero-weight case studies smoke
        run: |
          foundry refinery validate-dataset --task-spec examples/case-study-agent-tool-gate/task/spec.json
          foundry refinery preflight --task-spec examples/case-study-agent-tool-gate/task/spec.json
          foundry refinery run --task-spec examples/case-study-agent-tool-gate/task/spec.json --baseline-predictions examples/case-study-agent-tool-gate/task/baseline.jsonl --model-predictions examples/case-study-agent-tool-gate/task/model.jsonl --output-root .foundry/ci_tool_gate
          foundry refinery validate-dataset --task-spec examples/case-study-reconciliation-policy/task/spec.json
          foundry refinery preflight --task-spec examples/case-study-reconciliation-policy/task/spec.json
          foundry refinery run --task-spec examples/case-study-reconciliation-policy/task/spec.json --baseline-predictions examples/case-study-reconciliation-policy/task/baseline.jsonl --model-predictions examples/case-study-reconciliation-policy/task/model.jsonl --output-root .foundry/ci_reconcil_policy
          foundry refinery anchor --output-root examples/case-study-exception-codes/task/runs --out .foundry/replay-anchor.json
          foundry refinery artifact add examples/case-study-agent-tool-gate/task/spec.json --store-dir .foundry/ci_artifacts --name tool-gate-spec --kind spec
          foundry refinery artifact list --store-dir .foundry/ci_artifacts

  no-signing-extra:
    name: no-signing-extra fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install without signing extra
        run: |
          python -m pip install --quiet --upgrade "pip>=26.2"
          python -m pip install --quiet --no-deps -e .
      - name: Verify fail-closed signing absence
        run: |
          python -c "from hardonian_foundry.signing import backend_available; assert not backend_available(), 'expected signing backend unavailable'"
          python -m unittest tests/test_evidence.py tests/test_licensing.py tests/test_tenancy.py tests/test_baseline.py tests/test_synthetic_policy.py tests/test_content_datasets.py tests/test_provider.py -v
          python - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as td:
              root = Path(td) / "runs"
              run_proc = subprocess.run(
                  ["foundry", "refinery", "run", "--output-root", str(root)],
                  capture_output=True, text=True, check=True,
              )
              run_id = json.loads(run_proc.stdout)["run_id"]
              kg = subprocess.run(
                  ["foundry", "refinery", "keygen", "--out", str(Path(td) / "k.pem")],
                  capture_output=True, text=True, check=False,
              )
              assert kg.returncode != 0, f"expected keygen to fail closed, got {kg.returncode}"
              prom = subprocess.run(
                  ["foundry", "refinery", "promote", run_id, "--output-root", str(root)],
                  capture_output=True, text=True, check=False,
              )
              assert prom.returncode == 2, f"expected promote blocked exit 2, got {prom.returncode}"
              data = json.loads(prom.stdout)
              assert "cryptographic_promotion_signature" in data["missing_evidence"], data
          PY

  train-coverage:
    name: torch train coverage (ubuntu, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # This job exists because the offline-baseline matrix installs no torch, so its
    # coverage gate omits torch-only training_utils.py (see pyproject [tool.coverage.run]).
    # Here the FULL package is measured at the same fail-under=85 with torch code executing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install train extra with CPU-only torch wheel
        # The default PyPI torch wheel drags ~2.5GB of CUDA runtime into CI; the
        # PyTorch CPU index keeps cost and runtime bounded. Versions pinned to the
        # combo verified locally (torch 2.6.0+cpu, transformers 4.49.0, peft 0.14.0,
        # accelerate 1.4.0) — bump deliberately together with a local re-verify.
        run: |
          python -m pip install --quiet --upgrade "pip>=26.2"
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.6.0+cpu
          python -m pip install --quiet -e ".[signing]" pytest pytest-cov ruff mypy pillow pyyaml
          python -m pip install --quiet transformers==4.49.0 peft==0.14.0 accelerate==1.4.0 safetensors
      - name: Offline unit tests with torch present (plain unittest)
        run: python -m unittest discover -s tests -v
      - name: Pytest with full-package coverage gate (no omit)
        run: pytest --cov=hardonian_foundry --cov-config=.coveragerc-train --cov-fail-under=85
      - name: Torch modules executed, not silently skipped
        run: |
          out=$(pytest tests/test_case_study_scripts.py tests/test_synthetic_eval.py tests/test_training_utils_deep.py -q --no-cov 2>&1)
          echo "$out"
          if echo "$out" | grep -qi "skipped"; then
            echo "FAIL: torch-dependent tests skipped despite [train] install" >&2
            exit 1
          fi
          echo "$out" | grep -q "passed"

  package-smoke:
    name: wheel build and install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        run: |
          python -m pip install --quiet --upgrade "pip>=26.2"
          python -m pip install --quiet build
          python -m build
      - name: Install wheel into clean venv and run smoke
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --quiet --upgrade "pip>=26.2"
          .wheel-venv/bin/pip install --quiet dist/*.whl
          .wheel-venv/bin/foundry --version
          .wheel-venv/bin/foundry doctor
          .wheel-venv/bin/foundry demo

  security:
    name: security & static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned security tooling
        # pip>=26.2 first: pip-audit project mode audits the ephemeral env, which
        # bootstraps with the host pip; older pip versions carry known CVEs.
        run: python -m pip install --quiet --upgrade 'pip>=26.2' && python -m pip install --quiet ruff==0.17.4 bandit==1.9.4 pip-audit==2.10.1 'cryptography==50.0.2'
      - name: Ruff lint
        run: ruff check .
      - name: Bandit (medium and above)
        run: bandit -q -r src scripts examples --severity-level medium
      - name: Pip audit
        run: pip-audit --progress-spinner off
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }} # required by v3 for pull_request diff scans

  promptfoo-redteam:
    name: promptfoo licensing red-team
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Red-team the fail-closed licensing gate (deterministic, no model)
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
        run: npx -y promptfoo@0.125.1 eval -c evals/promptfoo.licensing.yaml --no-cache
