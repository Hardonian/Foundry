description: Foundry licensing gate red-team - fail-closed SPDX allowlist (deterministic, no model)
providers:
  - id: file://license_gate_provider.py
    label: foundry-licensing-gate
prompts:
  - "{{payload}}"
tests:
  # allow_mit
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"MIT","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'ALLOWED' && JSON.parse(output).promotion_allowed === false"
  # allow_apache
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"Apache-2.0","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'ALLOWED' && JSON.parse(output).promotion_allowed === false"
  # allow_bsd3
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"BSD-3-Clause","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'ALLOWED' && JSON.parse(output).promotion_allowed === false"
  # allow_cc0
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"CC0-1.0","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'ALLOWED' && JSON.parse(output).promotion_allowed === false"
  # allow_ofl
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"OFL-1.1","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'ALLOWED' && JSON.parse(output).promotion_allowed === false"
  # allow_full
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"Apache-2.0","provenance":"synthetic","data_origin":"synthetic","weights_sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","source_url":"https://example.com/m","notes":"ok"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'ALLOWED' && JSON.parse(output).promotion_allowed === false"
  # allow_public_research_provenance
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"MIT","provenance":"public_research","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'ALLOWED' && JSON.parse(output).promotion_allowed === false"
  # allow_url_loopback
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"MIT","provenance":"synthetic","data_origin":"synthetic","source_url":"http://127.0.0.1:8080"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'ALLOWED' && JSON.parse(output).promotion_allowed === false"
  # deny_proprietary
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"Proprietary","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'DENIED' && JSON.parse(output).promotion_allowed === false"
  # deny_agpl
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"AGPL-3.0-only","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'DENIED' && JSON.parse(output).promotion_allowed === false"
  # deny_gpl
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"GPL-3.0-only","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'DENIED' && JSON.parse(output).promotion_allowed === false"
  # deny_compound
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"Apache-2.0 OR Proprietary","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'DENIED' && JSON.parse(output).promotion_allowed === false"
  # deny_lowercase
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"apache-2.0","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'DENIED' && JSON.parse(output).promotion_allowed === false"
  # deny_padded
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":" Apache-2.0 ","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'DENIED' && JSON.parse(output).promotion_allowed === false"
  # deny_newline
  - vars:
      payload: '{"manifest":{"name":"demo-model","license_id":"MIT\n","provenance":"synthetic","data_origin":"synthetic"}}'
    assert:
      - type: javascript
        value: "JSON.parse(output).decision === 'DENIED' && JSON.parse(output).promotion_allowed === false"
  # deny_empty_license
