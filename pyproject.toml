[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardonian-foundry"
version = "0.2.0"
description = "Evidence-first model lifecycle: tamper-evident runs and fail-closed promotion gates"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.optional-dependencies]
signing = ["cryptography>=42.0"]

[project.scripts]
foundry = "hardonian_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
