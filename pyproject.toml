[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardonian-foundry"
version = "0.1.0"
description = "Offline-first, review-gated synthetic evaluation baseline"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
foundry = "hardonian_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
